name: ci

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libsndfile1 libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3 libfontconfig1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e ".[gui,dev]"
      - name: Contracts, examples, test vectors
        run: |
          python tools/gen_schemas.py --check
          python docs/specs/contracts/validate_examples.py
          python tools/gen_test_vectors.py --check
          python tools/check_prompt_embedding.py
      - name: Test suite
        run: python -m pytest -p no:cacheprovider -q
      - name: Dependency audit (informational)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.lock

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libsndfile1 libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3 libfontconfig1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . pyinstaller==6.22.3
      - name: Build standalone bundle (includes clean-environment smoke test)
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: SonicClue-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Draft release with artifacts and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} out/ \;
          (cd out && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "SonicClue $GITHUB_REF_NAME" --notes "See RELEASE_NOTES.md in the bundle. Hardware qualification status: see docs/specs/matrices/compatibility-matrix.csv."
